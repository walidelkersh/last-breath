name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build LastBreath.sln --configuration Release
      - name: Test
        run: dotnet test LastBreath.sln --configuration Release --no-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent check
        run: python -I scripts/independent_check.py --dives classic,static,tank
